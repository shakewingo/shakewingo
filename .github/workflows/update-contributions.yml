name: Update contributions

on:
  schedule:
    - cron: "0 2 * * 1"  # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_contributions.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if changed
        run: |
          git diff --quiet README.md contributions.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md contributions.json
          git commit -m "chore: update contributions"
          git push
